<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>TU Zeiterfassung</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Monat ausfüllen</h1>

  <div class="month">
    <button id="prev" type="button" aria-label="Vorheriger Monat" title="Vorheriger Monat (←)">‹</button>
    <span id="monthLabel"></span>
    <button id="next" type="button" aria-label="Nächster Monat" title="Nächster Monat (→)">›</button>
  </div>

  <div class="times">
    <label>Beginn <input id="start" type="time" required></label>
    <label>Ende <input id="end" type="time" required></label>
  </div>

  <div id="calendarBox" hidden>
    <div id="calendar" class="calendar" role="group" aria-label="Tage des Monats"></div>
    <div class="legend">
      <span><i class="swatch vacation"></i>Urlaub</span>
      <span><i class="swatch holiday"></i>Feiertag</span>
      <span><i class="swatch existing"></i>erfasst</span>
      <span><i class="swatch delete"></i>löschen</span>
    </div>
    <p class="hint">Leeren Tag anklicken: Urlaub. Erfassten Tag anklicken: löschen. Mit gedrückter Maus mehrere Tage.</p>
  </div>

  <p id="status" class="status" role="status"></p>

  <button id="fill" type="button" class="primary" disabled>Eintragen</button>

  <script src="popup.js"></script>
</body>
</html>
